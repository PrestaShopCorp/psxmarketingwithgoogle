services:
  PrestaShop\Module\PsxMarketingWithGoogle\Google\GoogleTransportInterface:
    class: PrestaShop\Module\PsxMarketingWithGoogle\Google\CurlGoogleTransport
    public: false

  PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleOAuthClient:
    class: PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleOAuthClient
    public: false
    arguments:
      - '@PrestaShop\Module\PsxMarketingWithGoogle\Google\GoogleTransportInterface'

  PrestaShop\Module\PsxMarketingWithGoogle\Security\SecretBox:
    class: PrestaShop\Module\PsxMarketingWithGoogle\Security\SecretBox
    public: true

  PrestaShop\Module\PsxMarketingWithGoogle\OAuth\OAuthStateRepository:
    class: PrestaShop\Module\PsxMarketingWithGoogle\OAuth\OAuthStateRepository
    public: true
    arguments:
      - '@psxmarketingwithgoogle.db'

  PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleCredentialRepository:
    class: PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleCredentialRepository
    public: true
    arguments:
      - '@psxmarketingwithgoogle.db'
      - '@PrestaShop\Module\PsxMarketingWithGoogle\Security\SecretBox'

  PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleConnectionService:
    class: PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleConnectionService
    public: true
    arguments:
      - '@PrestaShop\Module\PsxMarketingWithGoogle\OAuth\OAuthStateRepository'
      - '@PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleCredentialRepository'
      - '@PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleOAuthClient'

  PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleOAuthCallback:
    class: PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleOAuthCallback
    public: true
    arguments:
      - '@PrestaShop\Module\PsxMarketingWithGoogle\OAuth\OAuthStateRepository'
      - '@PrestaShop\Module\PsxMarketingWithGoogle\OAuth\GoogleConnectionService'
